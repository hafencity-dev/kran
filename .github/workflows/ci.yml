name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed for:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: vet cross-platform
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
      - name: test
        run: go test -race -p 4 ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X github.com/hafencity-dev/kran/internal/version.Version=ci-${{ github.sha }}" -o kran ./cmd/kran
      - uses: actions/upload-artifact@v4
        with:
          name: kran-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kran
          if-no-files-found: error
