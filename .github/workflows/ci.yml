name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: vet cross-platform
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
      - name: test
        run: go test -race -p 4 ./...

  e2e:
    # Real kran daemons and CLI (internal/e2e, build tag e2e); container
    # tests only where Docker is available (ubuntu).
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: e2e
        env:
          KRAN_E2E_RACE: "1"
          KRAN_TEST_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: go test -tags e2e -count=1 -v -timeout 60m ./internal/e2e/

  chaos:
    name: chaos (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: chaos
        env:
          KRAN_E2E_RACE: "1"
          KRAN_CHAOS_DURATION: 3m
        run: go test -tags chaos -run Chaos -count=1 -v -timeout 30m ./internal/e2e/

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X github.com/hafencity-dev/kran/internal/version.Version=ci-${{ github.sha }}" -o kran ./cmd/kran
      - uses: actions/upload-artifact@v4
        with:
          name: kran-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kran
          if-no-files-found: error
