name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: vet cross-platform
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
      - name: test
        # A hung test fails with a goroutine dump instead of the job timeout;
        # a hang outside a test binary (a leftover child holding its output)
        # ends at the step timeout and the next step shows what was left.
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          go test -race -p 4 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E '^(ok|FAIL|---|panic|\?)'
      - name: diagnose
        if: failure() || cancelled()
        shell: bash
        run: |
          echo "== last tests started"; grep -E '^=== (RUN|CONT)' "$RUNNER_TEMP/test.log" | tail -20 || true
          echo "== packages done"; grep -E '^(ok|FAIL)' "$RUNNER_TEMP/test.log" | tail -40 || true
          echo "== log tail"; tail -80 "$RUNNER_TEMP/test.log" || true
          echo "== leftover test processes"
          ps -axo pid,ppid,pgid,etime,rss,command | grep -E '\.test|helper|kran|sleep|sh -c|go-build' | grep -vE 'ps -axo|grep -E' || true

  e2e:
    # Real kran daemons and CLI (internal/e2e, build tag e2e); container
    # tests only where Docker is available (ubuntu).
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: e2e
        env:
          KRAN_E2E_RACE: "1"
          KRAN_TEST_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: go test -tags e2e -count=1 -v -timeout 60m ./internal/e2e/

  chaos:
    name: chaos (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: chaos
        env:
          KRAN_E2E_RACE: "1"
          KRAN_CHAOS_DURATION: 3m
        run: go test -tags chaos -run Chaos -count=1 -v -timeout 30m ./internal/e2e/

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X github.com/hafencity-dev/kran/internal/version.Version=ci-${{ github.sha }}" -o kran ./cmd/kran
      - uses: actions/upload-artifact@v4
        with:
          name: kran-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kran
          if-no-files-found: error
